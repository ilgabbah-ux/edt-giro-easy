<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Giro Easy · pista 3D (prova)</title>
<style>
@font-face { font-family: Anton; src: url(../anton.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: Barlow; font-weight: 700; src: url(../barlow-condensed-latin-700-normal.woff2) format('woff2'); font-display: swap; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
html, body { margin: 0; height: 100%; background: #101410; overflow: hidden; font-family: Barlow, 'Arial Narrow', sans-serif; color: #fff; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#lens { z-index: 1; pointer-events: none; }
.hud { position: fixed; z-index: 2; pointer-events: none; text-shadow: 0 2px 0 #000a; }
#spd { left: 14px; top: calc(12px + env(safe-area-inset-top)); font: 44px/1 Anton, Impact, sans-serif; color: #ffd400; } #spd small { font: 700 15px Barlow; color: #fff; margin-left: 4px; }
#tim { right: 14px; top: calc(12px + env(safe-area-inset-top)); font: 34px/1 Anton, Impact, sans-serif; text-align: right; } #tim small { display: block; font: 700 14px Barlow; color: #ffd400; margin-top: 3px; }
#bar { left: 14px; right: 14px; top: calc(66px + env(safe-area-inset-top)); height: 6px; background: #0008; border-radius: 3px; } #bar i { display: block; height: 100%; width: 0; background: #ffd400; border-radius: 3px; }
#msg { left: 0; right: 0; top: 30%; text-align: center; font: 64px/1 Anton, Impact, sans-serif; color: #ffd400; -webkit-text-stroke: 2px #111; }
#tip { left: 176px; right: 176px; bottom: calc(14px + env(safe-area-inset-bottom)); text-align: center; font: 600 14px/1.25 Barlow, sans-serif; color: #fff; background: #000c; padding: 6px 12px 8px; border-top: 3px solid #ffd400; border-radius: 0 0 6px 6px; } #tip b { display: block; color: #ffd400; font: 18px/1.15 Anton, Impact, sans-serif; letter-spacing: .04em; margin-bottom: 2px; }
#msg.small { font-size: min(32px, 5vw); top: 36%; left: 20%; right: 20%; -webkit-text-stroke: 1.5px #111; }
#tag { left: 0; right: 0; top: calc(82px + env(safe-area-inset-top)); text-align: center; font: 700 13px Barlow; letter-spacing: .08em; opacity: .75; }
.btn { position: fixed; z-index: 3; pointer-events: auto; border: 0; font: 700 18px Barlow, sans-serif; letter-spacing: .04em; color: #111; background: #ffd400; padding: 0 18px; height: 54px; transform: skewX(-8deg); box-shadow: 0 4px 0 #0009; }
.btn.dark { background: #1c1f1cdd; color: #fff; border: 2px solid #ffffff44; }
#brake { left: 14px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 132px; height: 92px; font-size: 24px; background: #d6332bdd; color: #fff; }
#gasb { right: 14px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 140px; height: 120px; font-size: 24px; touch-action: none; background: linear-gradient(to top, #ffd400 var(--g, 0%), #6b5a00cc var(--g, 0%)); color: #111; }
#again { right: 14px; top: calc(96px + env(safe-area-inset-top)); height: 40px; font-size: 15px; }
#opts { left: 14px; top: calc(96px + env(safe-area-inset-top)); height: 40px; font-size: 15px; }
#panel { position: fixed; z-index: 5; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #0b0e0bd9; padding: 24px; text-align: center; }
#panel h1 { font: 40px/1.02 Anton, Impact, sans-serif; margin: 0; color: #ffd400; } #panel p { margin: 0; max-width: 360px; font-size: 17px; line-height: 1.3; opacity: .92; }
#panel .btn { position: static; min-width: 240px; } #panel .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
#panel.hide, .hidden { display: none !important; }
@keyframes pulse { 0%, 100% { box-shadow: 0 4px 0 #0009, 0 0 0 0 #fff; } 50% { box-shadow: 0 4px 0 #0009, 0 0 0 9px #ffffffcc; } } .btn.pulse { animation: pulse .8s infinite; z-index: 4; }
#tip.done { border-top-color: #58d05a; } #tip.done b { color: #7fe081; }
/* bordi sicuri: tacca e angoli tondi, in orizzontale e in verticale */
:root { --L: max(14px, env(safe-area-inset-left)); --R: max(14px, env(safe-area-inset-right)); }
#spd, #brake, #opts { left: var(--L); } #tim, #gasb, #again { right: var(--R); } #bar { left: var(--L); right: var(--R); }
#msg { font-size: clamp(34px, 9vw, 64px); padding: 0 12px; }
#panel { overflow-y: auto; touch-action: pan-y; justify-content: safe center; } #panel * { touch-action: pan-y; }
/* ORIZZONTALE (schermo basso): menu compatto su due colonne, tasti di guida un po' più bassi, spiegazione tra i due tasti */
@media (orientation: landscape) and (max-height: 520px) {
  #panel { gap: 8px; padding: 10px calc(var(--R) + 6px) 10px calc(var(--L) + 6px); }
  #panel h1 { font-size: 26px; } #panel h1 br { display: none; } #panel p { font-size: 14px; max-width: 620px; line-height: 1.2; }
  #panel .btn { height: 40px; min-width: 0; font-size: 14px; padding: 0 12px; } #panel #go { min-width: 260px; height: 46px; font-size: 18px; } #panel .row { gap: 6px; max-width: 760px; } #panel .row .btn { flex: 1 1 22%; }
  #brake { height: 84px; } #gasb { height: 108px; }
  #tip { left: calc(var(--L) + 150px); right: calc(var(--R) + 158px); }
  #msg { top: 26%; } #msg.small { top: 34%; }
}
/* VERTICALE: tasti grandi in basso, spiegazione sopra i tasti a tutta larghezza, scritte più strette */
@media (orientation: portrait) {
  #tip { left: 10px; right: 10px; bottom: calc(160px + env(safe-area-inset-bottom)); font-size: 15px; }
  #tag { font-size: 10px; letter-spacing: .04em; padding: 0 8px; }
  #msg { top: 24%; } #msg.small { font-size: min(30px, 7.4vw); top: 27%; left: 6%; right: 6%; }
  #brake { width: 42vw; max-width: 190px; height: 110px; } #gasb { width: 42vw; max-width: 190px; height: 136px; }
  #panel { padding: 18px 14px; } #panel h1 { font-size: 34px; } #panel .btn { min-width: 0; } #panel #go { min-width: 260px; } #panel .row .btn { flex: 1 1 44%; font-size: 15px; padding: 0 8px; }
}
#moto{display:flex;align-items:stretch;gap:8px;margin:6px auto 8px;max-width:640px}#moto.hidden{display:none}#moto .btn{flex:0 0 52px;font-size:22px;padding:0}#mBox{flex:1;background:rgba(0,0,0,.45);border:2px solid #ffd400;padding:6px 10px;text-align:left;min-width:0}#mName{display:block;color:#ffd400;font-size:22px;letter-spacing:.04em}#mTxt{display:block;font-size:14px;line-height:1.2;color:#eee;margin:2px 0 5px}#mStat{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 8px;align-items:center;font-size:11px;color:#ccc}#mStat i{display:block;height:6px;background:#333}#mStat b{display:block;height:6px;background:#ffd400}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="lens"></canvas>
<div class="hud" id="spd">0<small>KM/H</small></div>
<div class="hud" id="tim">0.0<small id="best"></small></div>
<div class="hud" id="bar"><i></i></div>
<div class="hud" id="tag">PROVA · PISTA VERA 3D · TAPPA 1 · PERCORSO ENDURO · v44</div>
<div class="hud hidden" id="tip"></div>
<div class="hud" id="msg"></div>
<button class="btn" id="brake" type="button">FRENO</button>
<button class="btn" id="gasb" type="button">GAS</button>
<button class="btn dark" id="again" type="button">↺ RIPARTI</button>
<button class="btn dark" id="opts" type="button">☰ OPZIONI</button>
<div id="panel">
  <h1>GIRO EASY · <br>PISTA VERA 3D</h1>
  <p id="ptxt">Si guida inclinando il telefono come un manubrio. Gas col tasto giallo, freno col tasto rosso. Nelle opzioni qui sotto puoi farti aiutare (freno e gas automatici) e regolare lo sterzo.</p>
  <button class="btn" id="go" type="button">ACCENDI LA MOTO</button>
  <div id="moto"><button class="btn dark" id="mPrev" type="button">◀</button><div id="mBox"><b id="mName"></b><span id="mTxt"></span><div id="mStat"></div></div><button class="btn dark" id="mNext" type="button">▶</button></div>
  <div class="row">
    <button class="btn dark" id="oAuto" type="button"></button>
    <button class="btn dark" id="oGas" type="button"></button>
    <button class="btn dark" id="oSens" type="button"></button>
    <button class="btn dark" id="oInv" type="button"></button>
    <button class="btn dark" id="oCam" type="button"></button>
    <button class="btn dark" id="oSnd" type="button"></button>
    <button class="btn dark" id="oPista" type="button"></button>
  </div>
  <p id="pres" style="color:#ffd400;font-size:20px"></p>
</div>
<script>/* si aggiorna da sola: se in rete c'è una versione più nuova di questa pagina, la ricarica saltando la memoria del telefono */
(function () { var V = 44; fetch('versione.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) { var n = parseInt(t, 10); if (n > V && !new RegExp('[?&]v=' + n + '(&|$)').test(location.search)) location.replace(location.pathname + '?v=' + n); }).catch(function () {}); })();</script>
<script type="module" src="gioco.js?v=44"></script>
</body>
</html>
