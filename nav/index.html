<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>EDT Nav</title>
<meta name="theme-color" content="#0d0d0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;700&display=swap">
<style>
/* Layout: mappa a tutto schermo, barra dati in alto, pulsanti grandi in basso (usabili con i guanti) */
:root{
  --bg:#0d0d0c; --panel:#171715; --panel2:#22211e; --line:#34322d;
  --fg:#f4f1e8; --muted:#a39f93;
  --yellow:#ffd21f; --red:#e3261b; --green:#3ccf6e; --track:#ff3b8d;
  --rec:#ffd21f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
#map{position:fixed;inset:0;background:#1d1c19}
.leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.55)!important;color:#bbb!important}
.leaflet-control-attribution a{color:#ddd!important}

/* barra dati */
#hud{position:fixed;top:0;left:0;right:0;z-index:500;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--bg) 70%,rgba(13,13,12,0));pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(24px,7.5vw,40px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b i{font-style:normal;font-size:.5em;color:var(--muted);margin-left:2px}
#navbar{margin-top:6px;display:none;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#navbar.on{display:grid}
#navbar.off{border-color:var(--red);background:#3a0f0c}
#arrow{width:34px;height:34px;transition:transform .4s}
#navtxt{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums;min-width:0}
#navtxt span{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
#navbar.off #navtxt span{color:#ffb4ad}
#gpsdot{width:12px;height:12px;border-radius:50%;background:var(--muted)}
#gpsdot.ok{background:var(--green)} #gpsdot.weak{background:var(--yellow)}

/* pulsanti */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:500;
  padding:10px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr;gap:8px;
  background:linear-gradient(rgba(13,13,12,0),var(--bg) 30%)}
button{font:inherit;color:inherit;cursor:pointer;border:none}
.btn{background:var(--panel2);border:2px solid var(--line);border-radius:14px;min-height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.btn svg{width:26px;height:26px}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#recBtn{background:var(--red);border-color:var(--red);color:#fff;font-size:19px}
#recBtn.rec{background:var(--yellow);border-color:var(--yellow);color:#111}
#recBtn.paused{background:#5b4a07;border-color:var(--yellow);color:var(--yellow)}
#followBtn.on{border-color:var(--yellow);color:var(--yellow)}

.fab{position:fixed;right:max(12px,env(safe-area-inset-right,0px));z-index:500;width:54px;height:54px;border-radius:14px;
  background:var(--panel);border:2px solid var(--line);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
#layerBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
#stopBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 162px);display:none;border-color:var(--red);color:var(--red);font-family:var(--display);font-weight:800;font-size:13px}
#stopBtn.on{display:grid}

/* pannello tracce */
#sheet{position:fixed;inset:auto 0 0 0;z-index:900;max-height:78%;overflow:auto;
  background:var(--panel);border-top:2px solid var(--yellow);border-radius:18px 18px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .25s}
#sheet.open{transform:none}
#scrim{position:fixed;inset:0;z-index:850;background:rgba(0,0,0,.5);display:none}
#scrim.open{display:block}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-h h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:.02em}
.sheet-h h2 em{font-style:normal;color:var(--yellow)}
.close{width:48px;height:48px;border-radius:12px;background:var(--panel2);font-size:24px}
.load{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border-radius:14px;
  background:var(--yellow);color:#111;font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
h3{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px}
.sw{width:12px;height:38px;border-radius:4px}
.item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .acts{display:flex;gap:6px}
.mini{min-width:46px;height:46px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:700;padding:0 8px}
.mini.on{border-color:var(--yellow);color:var(--yellow)}
.mini.del{color:#ff8a80}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}

#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1000;background:var(--panel);border:2px solid var(--yellow);
  border-radius:14px;padding:14px 18px;font-weight:700;max-width:86%;text-align:center;display:none}
#toast.on{display:block}

.me{width:26px;height:26px;position:relative}
.me .ring{position:absolute;inset:3px;border-radius:50%;background:var(--yellow);border:3px solid #111;box-shadow:0 0 0 2px var(--yellow)}
.me .cone{position:absolute;left:50%;top:-14px;width:0;height:0;margin-left:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid var(--yellow);transform-origin:8px 27px;display:none}
.me.dir .cone{display:block}
.pin{font-family:var(--display);font-weight:800;font-size:12px;background:#111;color:var(--yellow);border:2px solid var(--yellow);border-radius:6px;padding:1px 5px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){#sheet,#arrow{transition:none}}
</style>
</head>
<body>
<div id="map"></div>

<div id="hud">
  <div class="stats">
    <div class="stat"><small>km/h</small><b id="sSpeed">–</b></div>
    <div class="stat"><small>Giro km</small><b id="sDist">0.0</b></div>
    <div class="stat"><small>Tempo</small><b id="sTime">0:00</b></div>
    <div class="stat"><small>Quota <span id="gpsdot" style="display:inline-block;vertical-align:middle;width:8px;height:8px"></span></small><b id="sAlt">–<i>m</i></b></div>
  </div>
  <div id="navbar">
    <svg id="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l7 19-7-4-7 4z" fill="#ffd21f"/></svg>
    <div id="navtxt">– <span>Carica una traccia GPX</span></div>
    <div id="navpct" style="font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted)"></div>
  </div>
</div>

<button class="fab" id="layerBtn" aria-label="Cambia mappa">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
</button>
<button class="fab" id="stopBtn" aria-label="Termina registrazione">STOP</button>

<div id="bar">
  <button class="btn" id="tracksBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19c4 0 3-6 8-6s4-6 8-6"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="7" r="2"/></svg>Tracce</button>
  <button class="btn" id="fitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Vedi tutto</button>
  <button class="btn" id="recBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg><span id="recLbl">Registra</span></button>
  <button class="btn on" id="followBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Segui</button>
</div>

<div id="scrim"></div>
<section id="sheet" aria-label="Tracce">
  <div class="sheet-h"><h2>Tracce <em>EDT</em></h2><button class="close" id="closeSheet" aria-label="Chiudi">✕</button></div>
  <button class="load" id="loadBtn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>
    Carica GPX
  </button>
  <input type="file" id="fileIn" accept=".gpx,application/gpx+xml,application/xml,text/xml" multiple hidden>
  <h3>Da seguire</h3>
  <div class="list" id="gpxList"></div>
  <h3>I tuoi giri registrati</h3>
  <div class="list" id="recList"></div>
</section>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(()=>{
/* ---------- utilità ---------- */
const $=id=>document.getElementById(id);
const R=6371000, rad=d=>d*Math.PI/180;
function hav(a,b){const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);const h=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)))}
function bearing(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));const x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return (Math.atan2(y,x)*180/Math.PI+360)%360}
const km=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(m<10000?2:1)+' km';
const fmtT=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Memoria piena: esporta e cancella qualche giro');return false}}};
let tT;function toast(t,ms=2200){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('on'),ms)}
const COLORS=['#ff3b8d','#2fb8ff','#b06bff','#ff8a1f','#3ccf6e','#ffffff'];

/* ---------- mappa ---------- */
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView(store.get('edt_view',[44.9,7.6]).slice(0,2),store.get('edt_view',[0,0,9])[2]||9);
const layers=[
  {n:'Topografica',l:L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,maxNativeZoom:17,attribution:'© OpenStreetMap, © OpenTopoMap'})},
  {n:'Sentieri OSM',l:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'})},
  {n:'Satellite',l:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'})}
];
let li=store.get('edt_layer',0)%layers.length;layers[li].l.addTo(map);
$('layerBtn').onclick=()=>{map.removeLayer(layers[li].l);li=(li+1)%layers.length;layers[li].l.addTo(map);store.set('edt_layer',li);toast('Mappa: '+layers[li].n,1200)};
map.on('moveend',()=>{const c=map.getCenter();store.set('edt_view',[c.lat,c.lng,map.getZoom()])});

/* ---------- GPX ---------- */
function parseGPX(txt,fallback){
  const x=new DOMParser().parseFromString(txt,'application/xml');
  if(x.getElementsByTagName('parsererror').length) throw new Error('File GPX non valido');
  const name=(x.querySelector('metadata > name, trk > name, rte > name')||{}).textContent||fallback;
  const pts=[];
  const grab=sel=>x.querySelectorAll(sel).forEach(p=>{const la=+p.getAttribute('lat'),lo=+p.getAttribute('lon');if(isFinite(la)&&isFinite(lo)){const e=p.querySelector('ele');pts.push([la,lo,e?+e.textContent:null])}});
  grab('trkpt'); if(!pts.length) grab('rtept');
  const wpts=[...x.querySelectorAll('wpt')].map(w=>({lat:+w.getAttribute('lat'),lon:+w.getAttribute('lon'),name:(w.querySelector('name')||{}).textContent||''}));
  if(!pts.length&&!wpts.length) throw new Error('Nessun punto trovato nel file');
  return {name:name.trim(),pts,wpts};
}
function toGPX(t){
  const pts=t.pts.map(p=>`<trkpt lat="${p[0].toFixed(7)}" lon="${p[1].toFixed(7)}">${p[2]!=null?`<ele>${p[2].toFixed(1)}</ele>`:''}${p[3]?`<time>${new Date(p[3]).toISOString()}</time>`:''}</trkpt>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="EDT Nav" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>${esc(t.name)}</name></metadata>\n<trk><name>${esc(t.name)}</name><trkseg>\n${pts}\n</trkseg></trk>\n</gpx>`;
}
function download(t){
  const b=new Blob([toGPX(t)],{type:'application/gpx+xml'});
  const file=new File([b],t.name.replace(/[^\w\- ]+/g,'_')+'.gpx',{type:'application/gpx+xml'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:t.name}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function trackLen(pts){let d=0;for(let i=1;i<pts.length;i++)d+=hav(pts[i-1],pts[i]);return d}
function gain(pts){let g=0,base=null;for(const p of pts){if(p[2]==null)continue;if(base==null){base=p[2];continue}if(p[2]-base>4){g+=p[2]-base;base=p[2]}else if(base-p[2]>4)base=p[2]}return g}

/* tracce da seguire */
let gpx=store.get('edt_gpx',[]); // {id,name,pts,wpts,color,vis}
let active=store.get('edt_active',null);
const drawn={};
function cumul(t){if(t._c)return t._c;const c=[0];for(let i=1;i<t.pts.length;i++)c.push(c[i-1]+hav(t.pts[i-1],t.pts[i]));t._c=c;return c}
function drawGpx(t){
  if(drawn[t.id]){drawn[t.id].remove();delete drawn[t.id]}
  if(!t.vis)return;
  const g=L.layerGroup();
  const ll=t.pts.map(p=>[p[0],p[1]]);
  if(ll.length){
    L.polyline(ll,{color:'#000',weight:9,opacity:.55}).addTo(g);
    L.polyline(ll,{color:t.color,weight:5,opacity:t.id===active?1:.75}).addTo(g);
    L.marker(ll[0],{icon:L.divIcon({className:'',html:'<div class="pin">PARTENZA</div>',iconSize:null,iconAnchor:[0,0]})}).addTo(g);
    L.marker(ll[ll.length-1],{icon:L.divIcon({className:'',html:'<div class="pin">ARRIVO</div>',iconSize:null,iconAnchor:[0,0]})}).addTo(g);
  }
  t.wpts.forEach(w=>L.circleMarker([w.lat,w.lon],{radius:7,color:'#111',weight:2,fillColor:'#ffd21f',fillOpacity:1}).bindTooltip(esc(w.name||'Punto'),{permanent:!!w.name,direction:'top',offset:[0,-6]}).addTo(g));
  g.addTo(map);drawn[t.id]=g;
}
function saveGpx(){store.set('edt_gpx',gpx.map(({_c,...t})=>t));store.set('edt_active',active)}
async function loadFiles(files){
  let last=null;
  for(const f of files){
    try{const p=parseGPX(await f.text(),f.name.replace(/\.gpx$/i,''));
      const t={id:'g'+Date.now()+Math.random().toString(36).slice(2,6),name:p.name,pts:p.pts,wpts:p.wpts,color:COLORS[gpx.length%COLORS.length],vis:true};
      gpx.push(t);last=t;
    }catch(e){toast(f.name+': '+e.message,3000)}
  }
  if(last){if(last.pts.length)active=last.id;saveGpx();gpx.forEach(drawGpx);renderLists();fitTo(last);closeSheet();toast('Traccia caricata: '+last.name);updateNav()}
}
$('loadBtn').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{loadFiles([...e.target.files]);e.target.value=''};
function fitTo(t){const ll=t.pts.map(p=>[p[0],p[1]]).concat(t.wpts.map(w=>[w.lat,w.lon]));if(ll.length){setFollow(false);map.fitBounds(L.latLngBounds(ll),{paddingTopLeft:[30,140],paddingBottomRight:[30,110]})}}

/* ---------- registrazione ---------- */
let rec=store.get('edt_rec_live',null); // {name,start,pts,paused,elapsed,resumedAt}
let recs=store.get('edt_recs',[]);
const recLine=L.polyline([],{color:'#ffd21f',weight:6}).addTo(map);
const recShadow=L.polyline([],{color:'#000',weight:10,opacity:.5}).addTo(map);recShadow.bringToBack();
let recDist=0;
function recalc(){const ps=rec?rec.pts.filter(Boolean):[];recDist=trackLen(ps);const ll=ps.map(p=>[p[0],p[1]]);recLine.setLatLngs(ll);recShadow.setLatLngs(ll)}
function elapsed(){if(!rec)return 0;return rec.elapsed+(rec.paused?0:(Date.now()-rec.resumedAt)/1000)}
function recUI(){
  const b=$('recBtn');b.classList.toggle('rec',!!rec&&!rec.paused);b.classList.toggle('paused',!!rec&&rec.paused);
  $('recLbl').textContent=!rec?'Registra':rec.paused?'Riprendi':'Pausa';
  $('stopBtn').classList.toggle('on',!!rec);
  b.querySelector('svg').innerHTML=!rec?'<circle cx="12" cy="12" r="7" fill="currentColor"/>':rec.paused?'<path d="M8 5l11 7-11 7z" fill="currentColor"/>':'<rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/>';
}
$('recBtn').onclick=()=>{
  if(!rec){const d=new Date();rec={name:'Giro EDT '+d.toLocaleDateString('it-IT')+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),start:Date.now(),pts:[],paused:false,elapsed:0,resumedAt:Date.now()};toast('Registrazione avviata');setFollow(true);startGPS()}
  else if(rec.paused){rec.paused=false;rec.resumedAt=Date.now();rec.pts.push(null);toast('Si riparte',1200)}
  else{rec.elapsed=elapsed();rec.paused=true;toast('In pausa',1200)}
  store.set('edt_rec_live',rec);recUI();wake();
};
let stopArmed=false;
$('stopBtn').onclick=()=>{
  if(!stopArmed){stopArmed=true;$('stopBtn').textContent='OK?';setTimeout(()=>{stopArmed=false;$('stopBtn').textContent='STOP'},3000);return}
  stopArmed=false;$('stopBtn').textContent='STOP';
  const pts=rec.pts.filter(Boolean);
  if(pts.length>1){const t={id:'r'+rec.start,name:rec.name,pts,time:Math.round(elapsed()),dist:Math.round(trackLen(pts)),gain:Math.round(gain(pts))};recs.unshift(t);store.set('edt_recs',recs);toast('Giro salvato: '+km(t.dist))}
  else toast('Giro troppo corto, non salvato');
  rec=null;store.set('edt_rec_live',null);recalc();recUI();renderLists();
};

/* ---------- GPS ---------- */
let me=null,meMk=null,acc=null,follow=true,watchId=null,lastFix=null,heading=null;
function setFollow(v){follow=v;$('followBtn').classList.toggle('on',v);if(v&&me)map.setView(me,Math.max(map.getZoom(),15))}
$('followBtn').onclick=()=>{startGPS();setFollow(true)};
map.on('dragstart',()=>setFollow(false));
$('fitBtn').onclick=()=>{
  const ll=[];gpx.filter(t=>t.vis).forEach(t=>{t.pts.forEach(p=>ll.push([p[0],p[1]]));t.wpts.forEach(w=>ll.push([w.lat,w.lon]))});
  if(rec)rec.pts.forEach(p=>p&&ll.push([p[0],p[1]]));if(me)ll.push(me);
  if(ll.length>1){setFollow(false);map.fitBounds(L.latLngBounds(ll),{paddingTopLeft:[30,140],paddingBottomRight:[30,110]})}else toast('Niente da mostrare: carica una traccia')
};
function startGPS(){
  if(watchId!=null)return;
  if(!navigator.geolocation){toast('GPS non disponibile su questo dispositivo');return}
  watchId=navigator.geolocation.watchPosition(onPos,err=>{
    $('gpsdot').className='';
    toast(err.code===1?'Permetti la posizione al browser per usare il GPS':'Segnale GPS assente, riprovo…',3000);
    if(err.code===1){watchId=null}
  },{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
}
function onPos(p){
  const c=p.coords,pt=[c.latitude,c.longitude];
  $('gpsdot').className=c.accuracy<=15?'ok':'weak';
  if(c.heading!=null&&!isNaN(c.heading)&&(c.speed||0)>1)heading=c.heading;
  else if(me&&hav(me,pt)>8)heading=bearing(me,pt);
  me=pt;
  if(!meMk){meMk=L.marker(pt,{icon:L.divIcon({className:'',html:'<div class="me"><div class="cone"></div><div class="ring"></div></div>',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:1000}).addTo(map);acc=L.circle(pt,{radius:c.accuracy,color:'#ffd21f',weight:1,fillOpacity:.08,interactive:false}).addTo(map)}
  meMk.setLatLng(pt);acc.setLatLng(pt).setRadius(c.accuracy);
  const el=meMk.getElement()?.querySelector('.me');if(el){el.classList.toggle('dir',heading!=null);const cone=el.querySelector('.cone');if(cone)cone.style.transform=`rotate(${heading||0}deg)`}
  const kmh=c.speed!=null&&!isNaN(c.speed)?c.speed*3.6:(lastFix?hav(lastFix.pt,pt)/Math.max(1,(p.timestamp-lastFix.t)/1000)*3.6:0);
  $('sSpeed').textContent=kmh<1?'0':Math.round(kmh);
  if(c.altitude!=null)$('sAlt').innerHTML=Math.round(c.altitude)+'<i>m</i>';
  lastFix={pt,t:p.timestamp};
  if(rec&&!rec.paused&&c.accuracy<=35){
    const prev=[...rec.pts].reverse().find(Boolean);
    if(!prev||hav(prev,pt)>=4){rec.pts.push([+pt[0].toFixed(7),+pt[1].toFixed(7),c.altitude!=null?Math.round(c.altitude*10)/10:null,p.timestamp]);
      if(prev)recDist+=hav(prev,pt);
      const ll=rec.pts.filter(Boolean).map(q=>[q[0],q[1]]);recLine.setLatLngs(ll);recShadow.setLatLngs(ll);
      if(rec.pts.length%5===0)store.set('edt_rec_live',rec);
    }
  }
  if(follow)map.panTo(pt,{animate:true});
  updateNav();
}

/* ---------- navigazione sulla traccia ---------- */
function nearest(t,p){
  const c=cumul(t),k=Math.cos(rad(p[0]));let best={d:Infinity,along:0,i:0};
  for(let i=1;i<t.pts.length;i++){
    const a=t.pts[i-1],b=t.pts[i];
    const ax=(a[1]-p[1])*k,ay=a[0]-p[0],bx=(b[1]-p[1])*k,by=b[0]-p[0];
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;let u=L2?-(ax*dx+ay*dy)/L2:0;u=Math.max(0,Math.min(1,u));
    const px=ax+u*dx,py=ay+u*dy,d=Math.sqrt(px*px+py*py)*rad(1)*R;
    if(d<best.d)best={d,along:c[i-1]+u*(c[i]-c[i-1]),i,u};
  }
  return best;
}
function updateNav(){
  const t=gpx.find(x=>x.id===active&&x.vis&&x.pts.length>1),nb=$('navbar');
  if(!t){nb.classList.remove('on');return}
  nb.classList.add('on');
  const total=cumul(t).at(-1);
  if(!me){$('navtxt').innerHTML=esc(km(total))+' <span>'+esc(t.name)+' · attendo il GPS</span>';$('navpct').textContent='';return}
  const n=nearest(t,me),left=Math.max(0,total-n.along),off=n.d>60;
  nb.classList.toggle('off',off);
  let target;
  if(off){const a=t.pts[n.i-1],b=t.pts[n.i];target=[a[0]+(b[0]-a[0])*n.u,a[1]+(b[1]-a[1])*n.u]}
  else{let j=n.i;while(j<t.pts.length-1&&cumul(t)[j]-n.along<40)j++;target=t.pts[j]}
  const br=bearing(me,target),rel=heading!=null?br-heading:br;
  $('arrow').style.transform=`rotate(${rel}deg)`;
  $('navtxt').innerHTML=off?'Fuori traccia '+esc(km(n.d))+' <span>Segui la freccia per rientrare</span>':esc(km(left))+' <span>all\'arrivo · '+esc(t.name)+'</span>';
  $('navpct').textContent=off?'':Math.round(n.along/total*100)+'%';
}

/* ---------- liste ---------- */
function renderLists(){
  const gl=$('gpxList');
  gl.innerHTML=gpx.length?'':'<div class="empty">Nessuna traccia. Carica il GPX del giro da seguire.</div>';
  gpx.forEach(t=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<div class="sw" style="background:${t.color}"></div><div style="min-width:0"><div class="name">${esc(t.name)}</div><div class="meta">${km(trackLen(t.pts))}${t.wpts.length?' · '+t.wpts.length+' punti':''}</div></div>
      <div class="acts"><button class="mini ${t.id===active?'on':''}" data-a="nav">${t.id===active?'Attiva':'Segui'}</button><button class="mini ${t.vis?'on':''}" data-a="vis">${t.vis?'👁':'—'}</button><button class="mini del" data-a="del">✕</button></div>`;
    d.onclick=e=>{const a=e.target.closest('button')?.dataset.a;if(!a){fitTo(t);closeSheet();return}
      if(a==='nav'){active=t.id;t.vis=true;fitTo(t);closeSheet()}
      if(a==='vis'){t.vis=!t.vis;if(!t.vis&&active===t.id)active=null}
      if(a==='del'){if(!e.target.dataset.sure){e.target.dataset.sure=1;e.target.textContent='Sicuro?';return}drawn[t.id]?.remove();delete drawn[t.id];gpx=gpx.filter(x=>x!==t);if(active===t.id)active=null}
      saveGpx();gpx.forEach(drawGpx);renderLists();updateNav()};
    gl.appendChild(d);
  });
  const rl=$('recList');
  rl.innerHTML=recs.length?'':'<div class="empty">Ancora nessun giro. Premi Registra quando parti.</div>';
  recs.forEach(t=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<div class="sw" style="background:var(--yellow)"></div><div style="min-width:0"><div class="name">${esc(t.name)}</div><div class="meta">${km(t.dist)} · ${fmtT(t.time)} · +${t.gain} m</div></div>
      <div class="acts"><button class="mini" data-a="see">Vedi</button><button class="mini" data-a="gpx">GPX</button><button class="mini del" data-a="del">✕</button></div>`;
    d.onclick=e=>{const a=e.target.closest('button')?.dataset.a;
      if(a==='gpx')download(t);
      if(a==='see'||!a){const g={id:'v'+t.id,name:t.name,pts:t.pts,wpts:[],color:'#ffd21f',vis:true};if(!gpx.find(x=>x.id===g.id)){gpx.push(g);saveGpx();drawGpx(g);renderLists()}fitTo(g);closeSheet()}
      if(a==='del'){if(!e.target.dataset.sure){e.target.dataset.sure=1;e.target.textContent='Sicuro?';return}recs=recs.filter(x=>x!==t);store.set('edt_recs',recs);renderLists()}};
    rl.appendChild(d);
  });
}
function openSheet(){renderLists();$('sheet').classList.add('open');$('scrim').classList.add('open')}
function closeSheet(){$('sheet').classList.remove('open');$('scrim').classList.remove('open')}
$('tracksBtn').onclick=openSheet;$('closeSheet').onclick=closeSheet;$('scrim').onclick=closeSheet;

/* ---------- schermo acceso ---------- */
let lock=null;
async function wake(){try{if('wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();if(rec)store.set('edt_rec_live',rec)}else if(rec)store.set('edt_rec_live',rec)});
window.addEventListener('pagehide',()=>{if(rec)store.set('edt_rec_live',rec)});

/* ---------- timer ---------- */
setInterval(()=>{
  $('sTime').textContent=fmtT(elapsed());
  $('sDist').textContent=(recDist/1000).toFixed(recDist<10000?2:1);
},1000);

/* ---------- avvio ---------- */
gpx.forEach(drawGpx);recalc();recUI();renderLists();startGPS();wake();
if(rec)toast('Registrazione ripresa: '+rec.name,2600);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
